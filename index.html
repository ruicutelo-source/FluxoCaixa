<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fluxo de Caixa</title>
<meta name="theme-color" content="#6b2a17">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f1ec; --card:#ffffff; --ink:#2a1d17; --muted:#7a6a61; --line:#e7ddd5;
  --brand:#6b2a17; --brand-2:#8a3a22; --brand-ink:#fff;
  --rec:#1f7a3a; --rec-bg:#e5f4e9; --des:#b3261e; --des-bg:#fbe7e5; --tr:#2f5d8a; --tr-bg:#e4eef8;
  --warn:#9a6700; --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.05);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#17120f; --card:#221a16; --ink:#f1e8e2; --muted:#a8978c; --line:#3a2e27;
    --brand:#8a3a22; --brand-2:#a5492c; --rec:#5ccf7d; --rec-bg:#16301f; --des:#ff8a80; --des-bg:#3a1d1a; --tr:#8cb8e6; --tr-bg:#1a2a3a;
    --shadow:0 1px 3px rgba(0,0,0,.4)}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}
/* layout */
header.top{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
header.top h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top select{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);border-radius:10px;color:#fff;padding:6px 8px}
header.top select option{color:#000}
.iconbtn{background:none;border:0;color:inherit;padding:6px;border-radius:10px;cursor:pointer;display:inline-flex}
.iconbtn:hover{background:rgba(255,255,255,.12)}
.sync{font-size:12px;opacity:.85}
main{padding:16px;padding-bottom:96px;max-width:1100px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer}
nav.tabs button.on{color:var(--brand)}
nav.tabs svg{width:22px;height:22px}
@media (min-width:900px){
  nav.tabs{top:56px;bottom:0;right:auto;width:200px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:12px 8px}
  nav.tabs button{flex:0;flex-direction:row;gap:12px;font-size:15px;padding:12px 14px;border-radius:10px;justify-content:flex-start}
  nav.tabs button.on{background:var(--bg)}
  main{margin-left:200px;padding:24px 28px 40px;max-width:none}
  .fab{right:32px!important;bottom:32px!important}
}
h2{font-size:20px;margin:4px 0 14px}
h3{font-size:15px;margin:0 0 10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:14px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:20px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.pos{color:var(--rec)} .neg{color:var(--des)} .trc{color:var(--tr)}
.two{display:grid;gap:14px}
.two>*{min-width:0}
.scroll th:first-child,.scroll td:first-child{position:sticky;left:0;background:var(--card);z-index:1}
@media (min-width:1000px){.two{grid-template-columns:1fr 1fr}}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
table.ind td{white-space:normal}
th{font-size:12px;color:var(--muted);font-weight:600}
tr.tot td{font-weight:700;border-top:2px solid var(--line)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--bg)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.muted{color:var(--muted)} .small{font-size:12px}
/* month chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.monthhead{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.monthhead div{border-radius:12px;padding:8px 10px}
.monthhead .l{font-size:11px;opacity:.8}.monthhead .v{font-weight:700;font-variant-numeric:tabular-nums}
.mh-r{background:var(--rec-bg);color:var(--rec)} .mh-d{background:var(--des-bg);color:var(--des)} .mh-s{background:var(--tr-bg);color:var(--tr)}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:10px}
.item{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer;border-left:4px solid var(--line)}
.item.Receita{border-left-color:var(--rec)} .item.Despesa{border-left-color:var(--des)} .item.Transferência{border-left-color:var(--tr)}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .val{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{font-size:11px;border-radius:6px;padding:1px 6px;margin-left:4px}
.b-warn{background:#fff3cd;color:#7a5b00}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:25;width:58px;height:58px;border-radius:50%;border:0;background:var(--brand);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.25);font-size:30px;cursor:pointer}
/* sheet / modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.overlay{align-items:center}}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media (min-width:700px){.sheet{border-radius:18px}}
.sheet h2{display:flex;align-items:center}
.sheet h2 span{flex:1}
.f{display:grid;gap:12px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fl{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.inp{width:100%;font-size:15px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:42px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--bg);padding:10px 4px;cursor:pointer}
.seg button.on.Receita{background:var(--rec);color:#fff}.seg button.on.Despesa{background:var(--des);color:#fff}.seg button.on.Transferência{background:var(--tr);color:#fff}
.btn{border:0;border-radius:10px;padding:11px 16px;cursor:pointer;background:var(--bg);border:1px solid var(--line)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.d{background:var(--des);color:#fff;border-color:var(--des)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btns .grow{flex:1}
.bar{height:8px;border-radius:4px;background:var(--brand-2);min-width:2px}
.toprow{display:grid;grid-template-columns:26px 1fr auto;gap:4px 8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.toprow .n{color:var(--muted);font-weight:700}
.toprow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toprow .bw{grid-column:2/4;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);white-space:nowrap}
.toprow .bwrap{flex:1;min-width:40px}
.toprow .med{grid-column:2/4;font-size:12px;color:var(--muted);margin-top:-2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;max-width:90vw}
/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login .card{width:100%;max-width:380px;padding:22px}
.login h1{margin:0 0 4px;font-size:22px;color:var(--brand)}
.err{color:var(--des);font-size:13px;min-height:18px}
.listed{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.listed span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.combo{position:relative}
.combo .inp{padding-right:40px}
.combo .cx{position:absolute;right:4px;top:50%;transform:translateY(-50%);color:var(--muted)}
.opts{border:1px solid var(--line);border-radius:10px;max-height:240px;overflow:auto;background:var(--card);margin-top:4px}
.opt{display:block;width:100%;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;color:var(--ink);font-size:14px}
.opt:last-child{border-bottom:0}
.opt:hover,.opt.act{background:var(--bg)}
.opt.sel{font-weight:700}
.optc{font-size:11px;color:var(--muted);padding:6px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
table.arr td:first-child{white-space:normal;word-break:break-word}
.idx{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:1000px){.idx{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ix{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;border-top:4px solid var(--line)}
.ix.g{border-top-color:#2e9d57}.ix.y{border-top-color:#d9a400}.ix.r{border-top-color:#d1372d}.ix.n{border-top-color:var(--line)}
.ix .h{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.ix .v{font-size:22px;font-weight:800;margin:2px 0;font-variant-numeric:tabular-nums}
.ix .lim{font-size:12px;color:var(--muted)}
.ix .why{font-size:12px;margin-top:4px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 auto}
.dot.g{background:#2e9d57}.dot.y{background:#d9a400}.dot.r{background:#d1372d}.dot.n{background:#bbb}
.alert{display:flex;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:0}
.alert .ic{font-size:18px;line-height:1.2}
.alert .tt{font-weight:600}
.alert .dd{font-size:13px;color:var(--muted)}
.alert.click{cursor:pointer}.alert.click:hover{background:var(--bg)}
.gbar{display:grid;grid-template-columns:minmax(90px,170px) 1fr auto;gap:8px;align-items:center;padding:5px 0;font-size:13px}
.gbar .tr{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}
.gbar .fi{height:100%;border-radius:5px}
.per{display:flex;gap:8px;align-items:center;margin:18px 0 10px}
.per h2{margin:0;flex:1}
.verbox{border-left:4px solid var(--brand)}
.verbox .vv{font-size:20px;font-weight:800;color:var(--brand)}
.verbox ul{margin:8px 0 0;padding-left:18px;font-size:13px}
.navver{display:none}
@media (min-width:900px){.navver{display:block;margin-top:auto;padding:10px 14px;font-size:12px;color:var(--muted)}}
.etq{display:grid;grid-template-columns:1fr;gap:4px;padding:8px 0;border-bottom:1px solid var(--line)}
@media (min-width:700px){.etq{grid-template-columns:1fr 170px 150px;align-items:center}}
.etq select{padding:6px 8px;min-height:34px;font-size:13px}
.etq .nm{font-size:14px}
table.arr td:first-child .small{margin-top:2px}
.d2ok{font-size:11px;color:var(--rec);min-height:14px}
.mov{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.mov:hover{background:var(--bg)}
.mov .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov .v{font-weight:700;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mov .b{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mov.ant{cursor:default;background:var(--bg);border-radius:8px}
.xhead{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
@media (min-width:700px){.xhead{grid-template-columns:repeat(4,minmax(0,1fr))}}
.xhead>div{border-radius:12px;padding:8px 10px;background:var(--card);box-shadow:var(--shadow)}
.xhead .l{font-size:11px;color:var(--muted)}.xhead .v{font-weight:700;font-variant-numeric:tabular-nums}
.selrow{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.selrow select{flex:1;min-width:140px}
</style>
</head>
<body>

<div id="loginView" class="login hidden">
  <form class="card f" id="loginForm">
    <div><h1>Fluxo de Caixa</h1><div class="muted small">Entre com o seu email e palavra-passe</div></div>
    <label class="fl">Email<input class="inp" id="lgEmail" type="email" autocomplete="username" required></label>
    <label class="fl">Palavra-passe<input class="inp" id="lgPass" type="password" autocomplete="current-password" required></label>
    <div class="err" id="lgErr"></div>
    <button class="btn p" type="submit">Entrar</button>
  </form>
</div>

<div id="appView" class="hidden">
  <header class="top">
    <h1 id="title">Fluxo de Caixa</h1>
    <span class="sync" id="sync"></span>
    <select id="yearSel" aria-label="Ano"></select>
    <button class="iconbtn" id="btnCfg" aria-label="Definições" title="Definições">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>
  <nav class="tabs" id="tabs">
    <button data-v="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>Início</button>
    <button data-v="lanc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Lançamentos</button>
    <button data-v="fluxo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-6"/></svg>Fluxo</button>
    <button data-v="top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 20V10M12 20V4M18 20v-7"/></svg>Top 10</button>
    <button data-v="bancos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10l9-6 9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 21h18"/></svg>Bancos</button>
    <button data-v="analise"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 6"/></svg>Análise</button>
    <div class="navver" id="navver"></div>
  </nav>
  <main id="main"></main>
  <button class="fab hidden" id="fab" aria-label="Novo lançamento">+</button>
</div>

<div id="modal"></div>

<script type="module">
import { firebaseConfig } from './firebase-config.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc,
         onSnapshot, addDoc, setDoc, updateDoc, deleteDoc, writeBatch, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const APP_VERSION = '1.5.0';
const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);
const db = initializeFirestore(fb, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });

/* ---------------- constants & helpers ---------------- */
const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const MESES_L = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const TIPOS = ['Receita','Despesa','Transferência'];
const D1 = { 'Receita':['Receita Operacional','Receita Não Operacional'],
             'Despesa':['Despesa Fixa','Despesa Variável','Despesa Não Operacional'],
             'Transferência':['Transferência entre Contas'] };
const LKEY = { 'Receita Operacional':'receitaOperacional', 'Receita Não Operacional':'receitaNaoOperacional',
               'Despesa Fixa':'despesaFixa', 'Despesa Variável':'despesaVariavel', 'Despesa Não Operacional':'despesaNaoOperacional' };
const EMPTY_LISTAS = { receitaOperacional:[], receitaNaoOperacional:[], despesaFixa:[], despesaVariavel:[],
                       despesaNaoOperacional:[], contas:[], saldosIniciais:{}, contaControlada:'' };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let fmtE; try { fmtE = new Intl.NumberFormat('pt-PT', { style:'currency', currency:'EUR', useGrouping:'always' }); } catch (e) { fmtE = new Intl.NumberFormat('pt-PT', { style:'currency', currency:'EUR' }); }
const eur = n => fmtE.format(Math.round((n || 0) * 100) / 100);
const pct = n => (isFinite(n) ? (n * 100).toLocaleString('pt-PT', { minimumFractionDigits:1, maximumFractionDigits:1 }) : '0,0') + '%';
const cls = n => n > 0.004 ? 'pos' : (n < -0.004 ? 'neg' : '');
const r2 = n => Math.round(n * 100) / 100;
const dPT = iso => iso ? iso.split('-').reverse().join('/') : '';
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const parseNum = s => { if (typeof s === 'number') return s; s = String(s || '').trim().replace(/\s|€/g, '');
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); const n = parseFloat(s); return isNaN(n) ? NaN : n; };
// month cycle: day 17 onwards belongs to next month (as in the workbook: 17 → 16)
function cycleOf(iso) { const [y, m, d] = iso.split('-').map(Number); let mi = m - 1, yy = y;
  if (d >= 17) { mi++; if (mi > 11) { mi = 0; yy++; } } return { mes: MESES[mi], ano: yy }; }
function anoFor(iso, mes) { const [y, m] = iso.split('-').map(Number); const mi = MESES.indexOf(mes);
  if (mi === 0 && m === 12) return y + 1; if (mi === 11 && m === 1) return y - 1; return y; }
// pesquisa sem acentos, sem maiúsculas, palavras por qualquer ordem, ignora hífens/barras
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
function filtra(opts, q) {
  const tk = norm(q).split(' ').filter(Boolean);
  const lst = [...opts].sort((a, b) => a.localeCompare(b, 'pt'));

    if (periodicos.length) push('n', `Pagamentos periódicos em ${ref}`, `${periodicos.join(', ')} — não se pagam todos os meses (trimestral/anual). Não é tendência.`, null);
    // ritmo do mês em curso
    const c0 = cycleOf(todayISO());
    if (c0.ano === ano && c0.mes === ref && ant.length) {
      const [y, mo, d] = todayISO().split('-').map(Number); const ini = d >= 17 ? new Date(y, mo - 1, 17) : new Date(y, mo - 2, 17); const fim = new Date(ini.getFullYear(), ini.getMonth() + 1, 16);
      const frac = Math.min(1, (new Date(y, mo - 1, d) - ini) / (fim - ini) + 1 / 30);
      const varMes = m => S.lancs.filter(l => l.ano === ano && l.mes === m && l.tipo === 'Despesa' && l.d1 === 'Despesa Variável').reduce((a, l) => a + (+l.valor || 0), 0);
      const media = ant.slice(-3).reduce((a, m) => a + varMes(m), 0) / Math.min(3, ant.length), ja = varMes(ref);
      if (media > 0 && ja / media > frac + 0.2) push('y', `Ritmo do mês: já gastou ${pct(ja / media)} do habitual em despesas variáveis`, `Vai em ${pct(frac)} do mês (${eur(ja)} de ${eur(media)} de média).`, null);
    }

}

/* ---------------- extrato bancário ---------------- */
function movimentos(banco, ano) {
  const out = [];
  for (const l of S.lancs) {
    if (l.ano !== ano) continue; const v = +l.valor || 0;
    let ent = 0, sai = 0, desc = l.d2, sub = l.d1;
    if (l.tipo === 'Receita' && l.conta === banco) ent = v;
    else if (l.tipo === 'Despesa' && l.conta === banco) sai = v;
    else if (l.tipo === 'Transferência') {
      if (l.conta === banco) { sai = v; desc = 'Transferência para ' + l.d2; sub = 'Transferência entre Contas'; }
      else if (l.d2 === banco) { ent = v; desc = 'Transferência de ' + l.conta; sub = 'Transferência entre Contas'; }
    }
    if (ent || sai) out.push({ l, data:l.data || '', ord:l.ord || 0, desc, sub, ent, sai });
  }
  out.sort((a, b) => a.data.localeCompare(b.data) || a.ord - b.ord);
  let s = +(S.listas.saldosIniciais || {})[banco] || 0;
  for (const m of out) { s = r2(s + m.ent - m.sai); m.saldo = s; }
  return out;
}

    ['Meses com saldo +', pos, ''], ['Meses com saldo −', neg, '']];
  const totD1 = D1.Despesa.map(n => [n, m.reduce((a, x) => a + (x.d1[n] || 0), 0)]);

    ${totD1.map(([n, v]) => `<tr><td>${n}</td><td>${eur(v)}</td><td>${pct(v / sD1)}</td><td>${eur(v / T.nm)}</td></tr>`).join('')}</table></div>
  <div class="card scroll"><h3>Movimentos por conta</h3><table><tr><th>Conta</th><th>Saldo inicial</th><th>Entradas</th><th>Saídas</th><th>Saldo</th></tr>
    ${cl.map(c => { const x = contas[c] || { ent:0, sai:0 }; const si = +(S.listas.saldosIniciais || {})[c] || 0; const s = si + x.ent - x.sai;

  </table><div class="small muted" style="margin-top:6px">Só a conta controlada tem todos os movimentos; as outras mostram apenas as transferências e lançamentos feitos nelas.</div></div></div></div>`;
}

document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => go(b.dataset.v));
$('#btnCfg').onclick = () => go('cfg');
$('#yearSel').onchange = e => { S.ano = +e.target.value; S.mes = null; S.topMes = null; render(); };
$('#fab').onclick = () => openForm(null);
function bindMain() {
  const M = $('#main');
  M.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  M.querySelectorAll('[data-chip]').forEach(b => b.onclick = () => { S.mes = b.dataset.chip; render(); });
  M.querySelectorAll('tr[data-mes]').forEach(r => r.onclick = () => { S.mes = r.dataset.mes; go('lanc'); });
  M.querySelectorAll('.item[data-id]').forEach(r => r.onclick = () => openForm(S.lancs.find(l => l.id === r.dataset.id)));
  const q = $('#q'); if (q) q.oninput = e => { S.q = e.target.value; const pos = e.target.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos); };
  const tm = $('#topMes'); if (tm) tm.onchange = e => { S.topMes = e.target.value; render(); };
  const ip = $('#iPer'); if (ip) ip.onchange = e => { S.iPer = e.target.value; render(); };
  M.querySelectorAll('[data-alert]').forEach(a => a.onclick = () => { const g = a.dataset.alert; if (g === 'cfg') return go('cfg');
    const l = S.lancs.filter(x => x.ano === S.ano && x.d2 === g).sort((x, y) => (y.data || '').localeCompare(x.data || ''))[0];
    S.mes = l ? l.mes : S.mes; S.q = g; go('lanc'); });
  const bb = $('#bBanco'); if (bb) bb.onchange = e => { S.banco = e.target.value; render(); };
  const bm = $('#bMes'); if (bm) bm.onchange = e => { S.bMes = e.target.value; render(); };

  M.querySelectorAll('a[data-go]').forEach(a => a.onclick = e => { e.preventDefault(); go(a.dataset.go); });
  if (S.view === 'cfg') bindCfg();
}
function bindCfg() {
  $('#cfgList').onchange = e => { S.cfgList = e.target.value; render(); };
  $('#btnAdd').onclick = async () => { const v = $('#newItem').value.trim(); const k = $('#cfgList').value; if (!v) return;
    const arr = [...(S.listas[k] || [])]; if (arr.includes(v)) return toast('Já existe na lista.'); arr.push(v);
    await saveListas({ [k]:arr }); toast('Adicionado.'); };
  $('#main').querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { const k = $('#cfgList').value; const arr = [...S.listas[k]];
    const it = arr[+b.dataset.del]; if (!(await ask(`Retirar "${it}" da lista?`, 'Retirar'))) return; arr.splice(+b.dataset.del, 1); await saveListas({ [k]:arr }); });
  $('#btnSaveSI').onclick = async () => { const si = {}; let bad = false;
    document.querySelectorAll('.si').forEach(i => { if (i.value.trim() === '') return; const n = parseNum(i.value); if (isNaN(n)) bad = true; else si[i.dataset.c] = n; });
    if (bad) return toast('Há um saldo inicial inválido.');
    const cp = [...document.querySelectorAll('.cp')].filter(x => x.checked && x.dataset.c !== $('#ctl').value).map(x => x.dataset.c);
    await saveListas({ saldosIniciais:si, contaControlada:$('#ctl').value, contasPoupanca:cp }); toast('Guardado.'); };
  $('#btnOut').onclick = async () => { if (await ask('Terminar a sessão neste aparelho?', 'Terminar')) signOut(auth); };
  $('#impFile').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) importXlsx(f); };
  $('#btnExp').onclick = exportXlsx;
  $('#btnArr').onclick = verArrumacao;
  $('#btnLim').onclick = async () => { const li = {}; let bad = false;
    document.querySelectorAll('.lim').forEach(i => { const n = parseNum(i.value); if (isNaN(n) || n < 0) bad = true; else li[i.dataset.k] = n; });
    const pf = $('#pFora').value.trim(); const pfn = pf === '' ? '' : parseNum(pf);
    if (bad || (pf !== '' && isNaN(pfn))) return toast('Há um valor inválido.');
    await saveListas({ limites:li, poupancaFora:pfn }); toast('Guardado.'); };
  $('#btnLim0').onclick = async () => { if (await ask('Repor os limites padrão?', 'Repor', false)) { await saveListas({ limites:{} }); toast('Limites repostos.'); } };
  $('#etqList').onchange = e => { S.etqList = e.target.value; render(); };
  const saveEtq = async d => { const g = document.querySelector(`.etg[data-d="${CSS.escape(d)}"]`).value, c = document.querySelector(`.etc[data-d="${CSS.escape(d)}"]`).value;
    const et = { ...(S.listas.etiquetas || {}) }; const def = ETQ[d];
    if (def && def[0] === g && def[1] === c) delete et[d]; else et[d] = { g, c };
    await saveListas({ etiquetas:et }); toast('Etiqueta guardada.'); };
  document.querySelectorAll('.etg,.etc').forEach(s => s.onchange = () => saveEtq(s.dataset.d));
}

        <div class="opts hidden" id="fD2list" role="listbox"></div>
        <div class="d2ok" id="fD2ok">${f.d2 ? '✓ escolhida' : ''}</div>
        <input type="hidden" id="fD2" value="${esc(f.d2)}"></div>
      <div class="f2"><label class="fl">Valor (€)<input class="inp" id="fVal" inputmode="decimal" placeholder="0,00" value="${f.valor !== '' && f.valor != null ? String(f.valor).replace('.', ',') : ''}"></label>
        <label class="fl">Data vencimento<input class="inp" type="date" id="fVenc" value="${f.venc || ''}"></label></div>
      <label class="fl">${contaLabel}<select class="inp" id="fConta">${L.contas.map(c => `<option ${c === f.conta ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label>

        <label class="fl">Situação<select class="inp" id="fSit">${['Pago','Pendente','Cancelado'].map(o => `<option ${o === f.situacao ? 'selected' : ''}>${o}</option>`).join('')}</select></label></div>

    </form></div>`;
    const grab = () => { f.data = $('#fData').value; f.mes = $('#fMes').value; f.d1 = $('#fD1').value; f.d2 = $('#fD2').value;

    // ---- Designação-2 com pesquisa ----
    const q2 = $('#fD2q'), box = $('#fD2list'), hid = $('#fD2'), ok = $('#fD2ok');
    let act = 0, shown = [], tBlur = null;
    const escolhe = o => { hid.value = o; q2.value = o; ok.textContent = '✓ escolhida'; box.classList.add('hidden'); };
    const lista = q => {
      shown = filtra(d2opts, q); act = 0;
      box.innerHTML = `<div class="optc">${shown.length} de ${d2opts.length}${q.trim() ? ` para «${esc(q.trim())}»` : ''}</div>` +
        (shown.length ? shown.map((o, i) => `<button type="button" class="opt ${i === 0 ? 'act' : ''} ${o === hid.value ? 'sel' : ''}" data-i="${i}">${esc(o)}</button>`).join('')
                      : '<div class="optc">Nada encontrado. Experimente outra palavra.</div>');
      box.classList.remove('hidden');
      box.querySelectorAll('.opt').forEach(b => b.onpointerdown = e => { e.preventDefault(); escolhe(shown[+b.dataset.i]); });
    };
    const marca = () => box.querySelectorAll('.opt').forEach((b, i) => { b.classList.toggle('act', i === act); if (i === act) b.scrollIntoView({ block:'nearest' }); });
    if (!q2.disabled) {
      q2.onfocus = () => { clearTimeout(tBlur); q2.select(); lista(q2.value === hid.value ? '' : q2.value); };
      q2.oninput = () => { const ex = d2opts.find(o => norm(o) === norm(q2.value));
        hid.value = ex || ''; ok.textContent = ex ? '✓ escolhida' : ''; lista(q2.value); };
      q2.onkeydown = e => {
        if (e.key === 'ArrowDown') { e.preventDefault(); act = Math.min(act + 1, shown.length - 1); marca(); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); act = Math.max(act - 1, 0); marca(); }
        else if (e.key === 'Enter') { e.preventDefault(); if (shown[act]) { escolhe(shown[act]); q2.blur(); } }
        else if (e.key === 'Escape') { box.classList.add('hidden'); } };

/* ---------------- Excel import/export ---------------- */
let xlsxP = null;
function loadXLSX() { return xlsxP ||= new Promise((res, rej) => { if (window.XLSX) return res(window.XLSX);
  const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  s.onload = () => res(window.XLSX); s.onerror = () => { xlsxP = null; rej(new Error('Não foi possível carregar o leitor de Excel (está sem internet?).')); };
  document.head.appendChild(s); }); }
const serialISO = n => { const d = new Date(Date.UTC(1899, 11, 30) + Math.round(n) * 86400000); return d.toISOString().slice(0, 10); };
function cellISO(v) { if (typeof v === 'number') return serialISO(v);
  if (typeof v === 'string') { const m = v.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/); if (m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  return ''; }
async function importXlsx(file) {
  const msg = { set textContent(t) { S.impMsg = t; const e = $('#impMsg'); if (e) e.textContent = t; } };
  msg.textContent = 'A ler o ficheiro…';
  try {
    const XLSX = await loadXLSX();
    const wb = XLSX.read(await file.arrayBuffer(), { type:'array' });
    const miss = MESES.filter(m => !wb.Sheets[m]); if (miss.length === 12) throw new Error('O ficheiro não tem as folhas Jan…Dez.');
    const val = (ws, ref) => ws && ws[ref] ? ws[ref].v : undefined;
    let ano = null; const t = String(val(wb.Sheets.Jan, 'A1') || ''); const ym = t.match(/(20\d\d)/); if (ym) ano = +ym[1];
    if (!ano) { msg.textContent = ''; const a = prompt('De que ano são os lançamentos?', String(new Date().getFullYear())); if (!a) return; ano = +a; }
    const rows = [];
    MESES.forEach(m => { const ws = wb.Sheets[m]; if (!ws) return;
      for (let r = 4; r <= 1000; r++) { const tipo = val(ws, 'B' + r); if (tipo == null || tipo === '') continue;
        const data = cellISO(val(ws, 'A' + r));
        rows.push({ data, mes:m, ano, tipo:String(tipo).trim(), d1:String(val(ws, 'C' + r) ?? '').trim(),
          d2:String(val(ws, 'D' + r) ?? '').trim(), valor:r2(+val(ws, 'E' + r) || 0), venc:cellISO(val(ws, 'F' + r)) || data,
          conta:String(val(ws, 'G' + r) ?? '').trim(), pago:String(val(ws, 'H' + r) ?? 'Sim').trim() || 'Sim',
          situacao:String(val(ws, 'I' + r) ?? 'Pago').trim() || 'Pago', ord:r }); } });
    const col = (sh, c) => { const ws = wb.Sheets[sh]; const out = []; if (!ws) return out;
      for (let r = 2; r <= 500; r++) { const v = val(ws, c + r); if (v != null && String(v).trim() !== '') out.push(String(v).trim()); } return out; };
    const contas = col('Cad3', 'B');
    const saldos = {}; const ban = wb.Sheets.BAN;
    contas.forEach((c, k) => { const v = val(ban, 'C' + (4 + k)); const n = typeof v === 'number' ? v : parseNum(v); if (!isNaN(n) && v !== undefined && v !== '') saldos[c] = n; });
    const listas = { receitaOperacional:col('Cad1', 'B'), receitaNaoOperacional:col('Cad1', 'D'), despesaFixa:col('Cad2', 'B'),
      despesaVariavel:col('Cad2', 'D'), despesaNaoOperacional:col('Cad2', 'F'), contas, saldosIniciais:saldos,
      contaControlada:contas.includes('Novo Banco') ? 'Novo Banco' : (S.listas.contaControlada || contas[0] || '') };
    const existing = S.lancs.filter(l => l.ano === ano);
    msg.textContent = '';
    if (!(await ask(`Encontrei ${rows.length} lançamentos de ${ano} e ${contas.length} conta(s).` + (existing.length ? ` Os ${existing.length} lançamentos de ${ano} que já estão na app vão ser substituídos.` : '') + ' Continuar?', 'Importar', false))) return;
    msg.textContent = 'A gravar…';
    const ops = [...existing.map(l => ['del', l.id]), ...rows.map(r => ['add', r])];
    for (let i = 0; i < ops.length; i += 400) { const b = writeBatch(db);
      ops.slice(i, i + 400).forEach(([k, x]) => k === 'del' ? b.delete(doc(db, 'lancamentos', x)) : b.set(doc(collection(db, 'lancamentos')), x));
      await b.commit(); msg.textContent = `A gravar… ${Math.min(i + 400, ops.length)}/${ops.length}`; }
    await setDoc(doc(db, 'config', 'listas'), listas);
    S.ano = ano; S.mes = null; msg.textContent = `Importados ${rows.length} lançamentos de ${ano}.`; toast('Importação concluída.');
  } catch (e) { console.error(e); msg.textContent = 'Erro: ' + e.message; }
}
/* ---------------- arrumação de designações (v1.3.0) ---------------- */
const ARR_REGRAS = [
  { n:'Levantamentos de 200 € são poupança', de:[], alsoIf:l => l.d2 === 'Levantamentos em Cartão (Diversos)' && Math.abs((+l.valor || 0) - 200) < 0.001, para:'Levantamento para Poupança', d1:'Despesa Não Operacional' },
  { n:'Meo: duas designações para a mesma fatura', de:['Assinaturas (Serviço Meo TV/Internet)', 'Internet / TV / Telefone'], para:'Meo (TV / Internet / Telefone)', d1:'Despesa Fixa' },
  { n:'Imposto de selo da Conta Pacote 100 (inclui o de maio com nome errado)', de:['Imposto Selo Manutenção da Conta Pacote 100'], alsoIf:l => l.d2 === 'Manutenção da Conta Pacote 100' && Math.abs((+l.valor || 0) - 0.32) < 0.001, para:'Imposto Selo Conta Pacote 100', d1:'Despesa Fixa' },
  { n:'Comissão mensal da Conta Pacote 100', de:['Conta Pacote 100', 'Manutenção da Conta Pacote 100'], para:'Comissão Conta Pacote 100', d1:'Despesa Fixa' },
  { n:'Juros da conta a descoberto', de:['Pagamento Juros (Conta Novo Banco)', 'Pagamento Juros da Conta (000073840863)'], para:'Juros Devedores (Novo Banco)', d1:'Despesa Não Operacional' },
  { n:'Imposto de selo sobre os juros', de:['Imposto de Selo (Juros)', 'Imposto de Selo (S/Juros)'], para:'Imposto de Selo s/ Juros', d1:'Despesa Não Operacional' },
  { n:'IMI num só sítio (despesa fixa anual)', de:['IMI (Mensalizado)', 'IMI (Imposto Municipal Imóveis)'], para:'IMI (Imposto Municipal sobre Imóveis)', d1:'Despesa Fixa' },
  { n:'Devoluções e estornos juntos (fora do rendimento-base)', de:['Ajuste Cartão Multibanco (Devolução de Compra)', 'Comissão Transação Internacional (Devolução)', 'Imposto Transação Internacional (Devolução)'], para:'Devoluções e Estornos', d1:'Receita Não Operacional' },
  { n:'Seguro de ocupantes (nome correto)', de:['Seguro Vida (Sobre os Veiculos (Cátia))'], para:'Seguro Ocupantes Veículos (Cátia)', d1:'Despesa Fixa' },
  { n:'Erro de escrita', de:['Tranferencia (Outros) Cátia'], para:'Transferência (Outros) Cátia', d1:'Receita Não Operacional' },
  { n:'Erro de escrita', de:['Instituto Gestão Finançeira SS (Plano Prestacional )'], para:'Instituto Gestão Financeira SS (Plano Prestacional)', d1:'Despesa Fixa' },
  { n:'Erro de escrita', de:['Seguro Multiriscos (Habitação)'], para:'Seguro Multirriscos (Habitação)', d1:'Despesa Fixa' },
  { n:'Erro de escrita', de:['Transferencia p/Terceiros (Nelson Filipe)'], para:'Transferência p/Terceiros (Nelson Filipe)', d1:'Despesa Não Operacional' },
  { n:'Erro de escrita', de:['Comissão Transferencia p/Terceiros (Nelson Filipe)'], para:'Comissão Transferência p/Terceiros (Nelson Filipe)', d1:'Despesa Não Operacional' },
  { n:'Erro de escrita', de:['Imposto Selo Transferencia p/Terceiros (Nelson Filipe)'], para:'Imposto Selo Transferência p/Terceiros (Nelson Filipe)', d1:'Despesa Não Operacional' },
];
const ARR_RETIRAR = ['Empréstimo / Renda da Casa'];
const D1KEY = { 'Receita Operacional':'receitaOperacional', 'Receita Não Operacional':'receitaNaoOperacional', 'Despesa Fixa':'despesaFixa', 'Despesa Variável':'despesaVariavel', 'Despesa Não Operacional':'despesaNaoOperacional' };
function regraDe(l) {
  if (l.tipo !== 'Receita' && l.tipo !== 'Despesa') return null;
  for (const r of ARR_REGRAS) if (r.alsoIf && r.alsoIf(l)) return r;
  for (const r of ARR_REGRAS) if (r.de.includes(l.d2)) return r;
  return null;
}
function planoArrumacao() {
  const mud = [], porRegra = new Map();
  for (const l of S.lancs) { const r = regraDe(l); if (!r) continue;
    if (l.d2 === r.para && l.d1 === r.d1) continue;
    mud.push({ l, r }); const k = r.para; const x = porRegra.get(k) || { r, n:0, v:0, de:new Set() };
    x.n++; x.v += +l.valor || 0; x.de.add(l.d2); porRegra.set(k, x); }
  // listas novas
  const L = S.listas, nova = {};
  const todos = new Set(ARR_REGRAS.flatMap(r => r.de));
  for (const k of Object.values(D1KEY)) nova[k] = (L[k] || []).filter(x => !todos.has(x) && !ARR_RETIRAR.includes(x));
  for (const r of ARR_REGRAS) { const k = D1KEY[r.d1]; for (const kk of Object.values(D1KEY)) if (kk !== k) nova[kk] = nova[kk].filter(x => x !== r.para);
    if (!nova[k].includes(r.para)) nova[k].push(r.para); }

  for (const x of emUso) for (const k of Object.values(D1KEY)) if ((L[k] || []).includes(x) && !nova[k].includes(x)) nova[k].push(x);
  // totais por ano e tipo, antes e depois (os valores não mudam)
  const tot = (arr) => { const t = {}; for (const l of arr) { const k = `${l.ano}|${l.tipo}`; t[k] = r2((t[k] || 0) + (+l.valor || 0)); } return t; };

function verArrumacao() {

  const chaves = [...new Set([...Object.keys(P.antes), ...Object.keys(P.depois)])].sort();
  const iguais = chaves.every(k => Math.abs((P.antes[k] || 0) - (P.depois[k] || 0)) < 0.005);
  const listMud = Object.entries(P.nova).some(([k, v]) => JSON.stringify(v) !== JSON.stringify(S.listas[k] || []));
  document.body.style.overflow = 'hidden';
  $('#modal').innerHTML = `<div class="overlay"><div class="sheet" style="max-width:720px"><h2><span>Arrumar designações</span><button class="iconbtn" id="arX">✕</button></h2>
    ${P.mud.length || listMud ? `
    <p class="small muted">Lançamentos que mudam de designação (só o nome/sítio — o valor fica igual):</p>
    <table class="arr"><tr><th>Correção</th><th>Lanç.</th><th>Valor</th></tr>${linhas || '<tr><td colspan="3" class="muted">Nenhum lançamento a mudar — só as listas.</td></tr>'}</table>
    ${P.retirados.length ? `<p class="small">Retirada da lista (não usada): ${P.retirados.map(esc).join(', ')}</p>` : ''}
    <h3 style="margin-top:14px">Prova de que os valores não mudam</h3>
    <div class="scroll"><table><tr><th>Ano · Tipo</th><th>Antes</th><th>Depois</th></tr>
      ${chaves.map(k => `<tr><td>${esc(k.replace('|', ' · '))}</td><td>${eur(P.antes[k])}</td><td>${eur(P.depois[k])}</td></tr>`).join('')}</table></div>
    <p class="small ${iguais ? 'pos' : 'neg'}" id="arProva">${iguais ? '✓ Totais iguais antes e depois.' : '✗ Os totais não batem — não aplicar.'}</p>
    <p class="small muted">Recomendação: antes de aplicar, exporte uma cópia para Excel.</p>
    <div class="btns"><button class="btn" id="arExp">Exportar cópia</button><button class="btn grow" id="arCan">Cancelar</button>
      <button class="btn p grow" id="arOk" ${iguais ? '' : 'disabled'}>Aplicar (${P.mud.length})</button></div>`
    : `<p>✅ Está tudo arrumado. Não há nada a mudar.</p><div class="btns"><button class="btn p grow" id="arCan">Fechar</button></div>`}
  </div></div>`;
  $('#arX').onclick = closeModal; $('#arCan').onclick = closeModal;
  if ($('#arExp')) $('#arExp').onclick = exportXlsx;
  if ($('#arOk')) $('#arOk').onclick = async () => {
    const b = $('#arOk'); b.disabled = true;
    try {
      for (let i = 0; i < P.mud.length; i += 400) { const wb = writeBatch(db);
        P.mud.slice(i, i + 400).forEach(({ l, r }) => wb.update(doc(db, 'lancamentos', l.id), { d2:r.para, d1:r.d1 }));
        await wb.commit(); b.textContent = `A gravar… ${Math.min(i + 400, P.mud.length)}/${P.mud.length}`; }
      const d = new Date();
      await saveListas({ ...P.nova, arrumacao1:`${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}` });
      closeModal(); toast(`Arrumação aplicada: ${P.mud.length} lançamento(s).`, 4000);
    } catch (e) { showErr(e); b.disabled = false; b.textContent = 'Tentar outra vez'; }
  };
}

async function exportXlsx() {
  try {
    const XLSX = await loadXLSX(); const wb = XLSX.utils.book_new();
    const H = ['Data Lançamento','Tipo','Designação - 1','Designação - 2','Valor','Data Vencimento','Conta Bancária','Pago','Situação'];
    const toD = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-').map(Number); return (Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 86400000; };
    MESES.forEach((m, i) => {
      const L = doAno().filter(l => l.mes === m).sort((a, b) => (a.data || '').localeCompare(b.data || '') || (a.ord || 0) - (b.ord || 0));
      const aoa = [[`LANÇAMENTOS — ${MESES_L[i].toUpperCase()} ${S.ano}`], [], H,
        ...L.map(l => [toD(l.data), l.tipo, l.d1, l.d2, l.valor, toD(l.venc), l.conta, l.pago, l.situacao])];
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      for (let r = 4; r <= L.length + 3; r++) for (const c of ['A', 'F']) { const x = ws[c + r]; if (x && x.t === 'n') x.z = 'dd/mm/yyyy'; }
      for (let r = 4; r <= L.length + 3; r++) { const x = ws['E' + r]; if (x) x.z = '#,##0.00 "€"'; }
      ws['!cols'] = [16, 14, 24, 40, 12, 16, 16, 8, 12].map(w => ({ wch:w }));
      XLSX.utils.book_append_sheet(wb, ws, m);
    });
    const Ls = S.listas; const mx = Math.max(...['receitaOperacional','receitaNaoOperacional','despesaFixa','despesaVariavel','despesaNaoOperacional','contas'].map(k => (Ls[k] || []).length));
    const la = [['Receita Operacional','Receita Não Operacional','Despesa Fixa','Despesa Variável','Despesa Não Operacional','Contas','Saldo inicial']];
    for (let i = 0; i < mx; i++) la.push(['receitaOperacional','receitaNaoOperacional','despesaFixa','despesaVariavel','despesaNaoOperacional','contas']
      .map(k => (Ls[k] || [])[i] ?? '').concat([(Ls.contas[i] != null && Ls.saldosIniciais[Ls.contas[i]] != null) ? Ls.saldosIniciais[Ls.contas[i]] : '']));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(la), 'Listas');
    Ls.contas.forEach(c => {
      const mv = movimentos(c, S.ano); const ini = +(Ls.saldosIniciais || {})[c] || 0;
      const aoa = [[`EXTRATO — ${c.toUpperCase()} — ${S.ano}`], [], ['Data', 'Mês', 'Descrição', 'Designação - 1', 'Entrada', 'Saída', 'Saldo'],
        ['', '', 'Saldo inicial', '', '', '', ini], ...mv.map(m => [toD(m.data), m.l.mes, m.desc, m.sub, m.ent || '', m.sai || '', m.saldo])];
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      for (let r = 5; r <= mv.length + 4; r++) { const x = ws['A' + r]; if (x && x.t === 'n') x.z = 'dd/mm/yyyy'; }
      for (let r = 4; r <= mv.length + 4; r++) for (const k of ['E', 'F', 'G']) { const x = ws[k + r]; if (x && x.t === 'n') x.z = '#,##0.00 "€"'; }
      ws['!cols'] = [12, 6, 40, 26, 12, 12, 12].map(w => ({ wch:w }));
      XLSX.utils.book_append_sheet(wb, ws, ('Extrato ' + c).replace(/[\\\/?*\[\]:]/g, ' ').slice(0, 31));
    });
    XLSX.writeFile(wb, `FluxoCaixa_${S.ano}_app.xlsx`);
  } catch (e) { toast('Erro: ' + e.message, 5000); }
}
